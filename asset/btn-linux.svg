<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 68" width="210" height="68">
  <defs>
    <linearGradient id="lin-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="lin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.85" />
    </linearGradient>
    <filter id="lin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #f59e0b); } }
    .arrow { animation: bounce 1.6s ease-in-out infinite; }
    .card { animation: pulse 4s ease-in-out infinite; }
  </style>
  <g class="card">
    <rect x="2" y="2" width="206" height="64" rx="14" fill="#120c04" stroke="url(#lin-border)" stroke-width="1.8" />
    <rect x="2" y="2" width="206" height="64" rx="14" fill="url(#lin-bg)" />
    
    <!-- Icon Box -->
    <rect x="12" y="12" width="44" height="44" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
    <text x="21" y="41" font-size="22">🐧</text>

    <!-- Labels -->
    <text x="64" y="30" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">LINUX</text>
    <text x="64" y="47" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Releases (AppImage)</text>

    <!-- Animated Download Arrow Badge -->
    <g class="arrow" transform="translate(170, 23)">
      <circle cx="11" cy="11" r="11" fill="#f59e0b" filter="url(#lin-glow)" />
      <path d="M 8,9 L 11,12 L 14,9 M 11,5 L 11,12 M 7,15 L 15,15" stroke="#05070e" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
