<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Shimmering Aurora Gradient -->
    <linearGradient id="aurora-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#7000ff;#ff007a;#00f5ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#00f5ff;#7000ff;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ff007a;#00f5ff;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#7000ff;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Border Gradients -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="mesh-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#121b33" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(0.8deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes glint {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes eq1 { 0%, 100% { height: 8px; } 50% { height: 32px; } }
    @keyframes eq2 { 0%, 100% { height: 30px; } 50% { height: 10px; } }
    @keyframes eq3 { 0%, 100% { height: 16px; } 50% { height: 38px; } }
    @keyframes eq4 { 0%, 100% { height: 36px; } 50% { height: 12px; } }
    @keyframes eq5 { 0%, 100% { height: 20px; } 50% { height: 34px; } }
    @keyframes eq6 { 0%, 100% { height: 10px; } 50% { height: 28px; } }
    @keyframes eq7 { 0%, 100% { height: 32px; } 50% { height: 14px; } }
    @keyframes eq8 { 0%, 100% { height: 18px; } 50% { height: 36px; } }

    .floating-logo { animation: float 6s ease-in-out infinite; transform-origin: 140px 150px; }
    .pulsing-orb { animation: pulse 7s ease-in-out infinite; transform-origin: 50% 50%; }
    .shimmer-star { animation: glint 2.2s ease-in-out infinite; }
    .eq-bar-1 { animation: eq1 1.1s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: eq3 1.3s ease-in-out infinite; }
    .eq-bar-4 { animation: eq4 0.8s ease-in-out infinite; }
    .eq-bar-5 { animation: eq5 1.2s ease-in-out infinite; }
    .eq-bar-6 { animation: eq6 1.0s ease-in-out infinite; }
    .eq-bar-7 { animation: eq7 1.4s ease-in-out infinite; }
    .eq-bar-8 { animation: eq8 0.85s ease-in-out infinite; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="960" height="300" rx="24" fill="url(#mesh-bg)" stroke="url(#glass-border)" stroke-width="2" />

  <!-- Animated Ambient Light Orbs -->
  <circle class="pulsing-orb" cx="190" cy="150" r="130" fill="url(#aurora-anim)" opacity="0.32" filter="url(#banner-glow)" />
  <circle class="pulsing-orb" cx="740" cy="100" r="110" fill="#00d2ff" opacity="0.18" filter="url(#banner-glow)" style="animation-delay: -3s;" />
  <circle class="pulsing-orb" cx="840" cy="220" r="90" fill="#a855f7" opacity="0.22" filter="url(#banner-glow)" style="animation-delay: -5s;" />

  <!-- Top Glass Highlight Arc -->
  <path d="M 40,2 C 260,2 700,2 920,2 C 940,2 920,26 840,26 C 580,26 380,26 120,26 C 40,26 20,2 40,2 Z" fill="#ffffff" opacity="0.12" />

  <!-- ==================== LEFT: FLOATING HV MONOGRAM EMBLEM ==================== -->
  <g class="floating-logo" transform="translate(55, 50)">
    <!-- Squircle Glass Capsule -->
    <rect x="10" y="10" width="180" height="180" rx="46" fill="#080d1a" stroke="url(#glass-border)" stroke-width="2.2" filter="url(#banner-glow)" />
    <!-- Inner Sheen -->
    <rect x="14" y="14" width="172" height="172" rx="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    
    <!-- HV Letterforms -->
    <g filter="url(#neon-glow)" transform="translate(-10, -12) scale(0.85)">
      <!-- Left Bar of H -->
      <path d="M 46,62 C 46,56 50,52 56,52 L 66,52 C 72,52 76,56 76,62 L 76,188 C 76,194 72,198 66,198 L 56,198 C 50,198 46,194 46,188 Z" fill="url(#aurora-anim)" />
      <!-- Right Bar of H -->
      <path d="M 94,62 C 94,56 98,52 104,52 L 114,52 C 120,52 124,56 124,62 L 124,188 C 124,194 120,198 114,198 L 104,198 C 98,198 94,194 94,188 Z" fill="url(#aurora-anim)" />
      <!-- Crossbar of H -->
      <path d="M 74,116 L 96,116 C 101,116 105,120 105,125 L 105,131 C 105,136 101,140 96,140 L 74,140 C 69,140 65,136 65,131 L 65,125 C 65,120 69,116 74,116 Z" fill="url(#aurora-anim)" />
      <!-- Letter V Wings -->
      <path d="M 142,54 L 166,54 L 178,144 L 190,54 L 214,54 L 188,190 C 185,199 171,199 168,190 Z" fill="url(#aurora-anim)" />
    </g>

    <!-- Star Glint -->
    <g class="shimmer-star" transform="translate(108, 102)">
      <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.8" fill="#00f5ff" />
    </g>
  </g>

  <!-- ==================== RIGHT: HEADER, EQUALIZER & TYPOGRAPHY ==================== -->
  <g transform="translate(295, 55)">
    <!-- Top Pill Badge + Equalizer -->
    <g>
      <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4.5" fill="#00f5ff" />
      <text x="27" y="18.5" fill="#00f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">⚡ OFFICIAL v1.0.0 RELEASE</text>

      <!-- Animated Equalizer Bars -->
      <g transform="translate(305, 25)">
        <rect class="eq-bar-1" x="0" y="-20" width="3.5" height="20" rx="1.75" fill="#00f5ff" />
        <rect class="eq-bar-2" x="7" y="-20" width="3.5" height="20" rx="1.75" fill="#38bdf8" />
        <rect class="eq-bar-3" x="14" y="-20" width="3.5" height="20" rx="1.75" fill="#818cf8" />
        <rect class="eq-bar-4" x="21" y="-20" width="3.5" height="20" rx="1.75" fill="#c084fc" />
        <rect class="eq-bar-5" x="28" y="-20" width="3.5" height="20" rx="1.75" fill="#ec4899" />
        <rect class="eq-bar-6" x="35" y="-20" width="3.5" height="20" rx="1.75" fill="#818cf8" />
        <rect class="eq-bar-7" x="42" y="-20" width="3.5" height="20" rx="1.75" fill="#38bdf8" />
        <rect class="eq-bar-8" x="49" y="-20" width="3.5" height="20" rx="1.75" fill="#00f5ff" />
      </g>
    </g>

    <!-- Master Title: HEMAN VIBES -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="2.5" filter="url(#neon-glow)">HEMAN VIBES</text>

    <!-- Subtitle -->
    <text x="0" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">
      Ad-Free YouTube Music Arena • Lossless Streaming • Synced Karaoke Lyrics
    </text>

    <!-- Tech Badges Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🎧 256kbps Audio</text>

      <rect x="145" y="0" width="135" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="159" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🎤 Synced Lyrics</text>

      <rect x="290" y="0" width="135" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="304" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🎛️ 10-Band EQ</text>

      <rect x="435" y="0" width="145" height="26" rx="13" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1" />
      <text x="449" y="17" fill="#00d2ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⬇️ Touch Below to Get</text>
    </g>

    <!-- Bottom Guide Notice -->
    <text x="2" y="206" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
      👇 Select your device button below for immediate direct download:
    </text>

  </g>
</svg>
